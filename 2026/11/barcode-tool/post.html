<div id="bcg">
<style>
#bcg{font-family:inherit;color:#1f2937;max-width:720px}
#bcg .tabs{display:flex;gap:6px;margin:0 0 14px}
#bcg .tabs button{flex:1;padding:10px;border:1px solid #cbd5e1;background:#f8fafc;border-radius:8px;font-size:15px;cursor:pointer}
#bcg .tabs button.on{background:#0f766e;color:#fff;border-color:#0f766e}
#bcg .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
#bcg label{font-size:14px;color:#475569}
#bcg input[type=text],#bcg select{font-size:16px;padding:8px;border:1px solid #cbd5e1;border-radius:6px}
#bcg input[type=text]{flex:1;min-width:180px}
#bcg .btn{padding:9px 14px;border:0;border-radius:6px;background:#0f766e;color:#fff;font-size:15px;cursor:pointer}
#bcg .btn.sub{background:#e2e8f0;color:#1f2937}
#bcg .out{margin:14px 0;padding:16px;background:#fff;border:1px solid #e5e7eb;border-radius:10px;text-align:center;overflow-x:auto}
#bcg canvas{max-width:100%;height:auto}
#bcg .msg{font-size:14px;margin:6px 0;min-height:20px}
#bcg .ok{color:#047857}#bcg .bad{color:#b91c1c}
#bcg .pane{display:none}#bcg .pane.on{display:block}
</style>
<div class="tabs"><button type="button" data-t="bar" class="on">바코드 · 모양 바코드</button><button type="button" data-t="qr">QR코드</button></div>

<div class="pane on" data-p="bar">
 <div class="row"><input type="text" id="bcg-val" value="8801234567893" aria-label="바코드 내용"><select id="bcg-fmt" aria-label="바코드 형식"><option value="CODE128">CODE128 (숫자·영문)</option><option value="EAN13">EAN-13 (상품 13자리)</option><option value="CODE39">CODE39</option></select></div>
 <div class="row"><label for="bcg-shape">모양</label><select id="bcg-shape"><option value="none">없음 (일반 바코드)</option><option value="apple">사과</option><option value="basket">바구니</option><option value="cat">고양이</option><option value="upload">내 그림 올리기</option></select>
  <input type="file" id="bcg-img" accept="image/*" style="display:none" aria-label="모양으로 쓸 그림"></div>
 <div class="row"><label for="bcg-depth">모양 높이</label><input type="range" id="bcg-depth" min="40" max="160" value="100"><button type="button" class="btn" id="bcg-make">바코드 만들기</button><button type="button" class="btn sub" id="bcg-png">PNG 저장</button></div>
 <div class="msg" id="bcg-msg"></div>
 <div class="out"><canvas id="bcg-cv"></canvas></div>
</div>

<div class="pane" data-p="qr">
 <div class="row"><input type="text" id="bcg-qval" value="https://enoch0.blogspot.com/" aria-label="QR코드 내용"><button type="button" class="btn" id="bcg-qmake">QR 만들기</button></div>
 <div class="row"><label for="bcg-logo">가운데 로고(선택)</label><input type="file" id="bcg-logo" accept="image/*"><button type="button" class="btn sub" id="bcg-qclear">로고 빼기</button><button type="button" class="btn sub" id="bcg-qpng">PNG 저장</button></div>
 <div class="msg" id="bcg-qmsg"></div>
 <div class="out"><canvas id="bcg-qcv"></canvas></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
(function(){
var $=function(id){return document.getElementById(id)};
var userShape=null,userLogo=null;

// 화면 이미지를 다시 읽어서 스캐너로 읽히는지 확인
function scan(cv){
 try{var w=cv.width,h=cv.height,d=cv.getContext('2d').getImageData(0,0,w,h).data,lum=new Uint8ClampedArray(w*h);
  for(var i=0;i<w*h;i++)lum[i]=(d[i*4]*299+d[i*4+1]*587+d[i*4+2]*114)/1000;
  var hints=new Map();hints.set(ZXing.DecodeHintType.TRY_HARDER,true);
  return new ZXing.MultiFormatReader().decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.RGBLuminanceSource(lum,w,h))),hints).getText();
 }catch(e){return null}
}
function report(el,cv,want){var got=scan(cv);
 el.className='msg '+(got===want?'ok':'bad');
 el.textContent=got===want?'✔ 스캔 확인: "'+got+'" 으로 읽힙니다.':(got?'⚠ 다르게 읽힘: "'+got+'"':'✖ 화면 이미지에서 읽히지 않습니다. 모양 높이를 낮추거나 다른 그림을 써 보세요.');}

// 기본 모양: 직접 그린 단순 실루엣(검은 부분이 모양)
var SHAPES={
 apple:function(g,w,h){g.beginPath();g.ellipse(w*.38,h*.62,w*.24,h*.36,0,0,7);g.ellipse(w*.62,h*.62,w*.24,h*.36,0,0,7);g.fill();g.fillRect(w*.48,h*.05,w*.04,h*.25);g.beginPath();g.ellipse(w*.62,h*.14,w*.1,h*.06,-.5,0,7);g.fill();},
 basket:function(g,w,h){g.lineWidth=h*.08;g.beginPath();g.arc(w*.5,h*.62,w*.3,Math.PI,0);g.stroke();g.beginPath();g.moveTo(w*.08,h*.55);g.lineTo(w*.92,h*.55);g.lineTo(w*.8,h);g.lineTo(w*.2,h);g.closePath();g.fill();},
 cat:function(g,w,h){g.beginPath();g.ellipse(w*.5,h*.66,w*.3,h*.34,0,0,7);g.fill();g.beginPath();g.moveTo(w*.24,h*.5);g.lineTo(w*.3,h*.02);g.lineTo(w*.46,h*.38);g.fill();g.beginPath();g.moveTo(w*.76,h*.5);g.lineTo(w*.7,h*.02);g.lineTo(w*.54,h*.38);g.fill();}
};
function maskTops(kind,w,h){var m=document.createElement('canvas');m.width=w;m.height=h;var g=m.getContext('2d');g.fillStyle='#000';g.strokeStyle='#000';
 if(kind==='upload'&&userShape){var s=Math.min(w/userShape.width,h/userShape.height),dw=userShape.width*s,dh=userShape.height*s;g.drawImage(userShape,(w-dw)/2,h-dh,dw,dh);}else if(SHAPES[kind])SHAPES[kind](g,w,h);
 var d=g.getImageData(0,0,w,h).data,tops=new Array(w);
 for(var x=0;x<w;x++){tops[x]=h;for(var y=0;y<h;y++){var k=(y*w+x)*4;if(d[k+3]>128&&(d[k]+d[k+1]+d[k+2])<600){tops[x]=y;break;}}}
 return tops;}

function makeBar(){
 var val=$('bcg-val').value.trim(),fmt=$('bcg-fmt').value,kind=$('bcg-shape').value,cv=$('bcg-cv'),msg=$('bcg-msg');
 if(!val){msg.className='msg bad';msg.textContent='바코드 내용을 넣어 주세요.';return;}
 if(kind==='upload'&&!userShape){$('bcg-img').click();return;}
 var band=90,extra=kind==='none'?0:+$('bcg-depth').value,src=document.createElement('canvas');
 try{JsBarcode(src,val,{format:fmt,height:band+extra,margin:20,displayValue:true,fontSize:20,background:'#ffffff'});}
 catch(e){msg.className='msg bad';msg.textContent='이 형식에 맞지 않는 내용입니다. (EAN-13은 숫자 12~13자리)';cv.width=cv.width;return;}
 cv.width=src.width;cv.height=src.height;var g=cv.getContext('2d');g.drawImage(src,0,0);
 if(extra){var top=20,left=20,bw=src.width-40,tops=maskTops(kind,bw,extra);g.fillStyle='#fff';
  // 모양 밖 막대 윗부분만 지운다. 아래 band 높이의 읽는 띠는 그대로 둔다.
  for(var x=0;x<bw;x++)if(tops[x]>0)g.fillRect(left+x,top,1,tops[x]);}
 report(msg,cv,val);
}
function makeQR(){
 var val=$('bcg-qval').value.trim(),cv=$('bcg-qcv'),msg=$('bcg-qmsg');if(!val)return;
 var q=qrcode(0,'H');q.addData(val);q.make();var n=q.getModuleCount(),cell=8,pad=4*cell;
 cv.width=cv.height=n*cell+pad*2;var g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);g.fillStyle='#000';
 for(var r=0;r<n;r++)for(var c=0;c<n;c++)if(q.isDark(r,c))g.fillRect(pad+c*cell,pad+r*cell,cell,cell);
 if(userLogo){var s=Math.round(n*cell*.22),x=(cv.width-s)/2;g.fillStyle='#fff';g.fillRect(x-6,x-6,s+12,s+12);g.drawImage(userLogo,x,x,s,s);}
 report(msg,cv,val);
}
function readImg(file,cb){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){cb(im)};im.src=r.result};r.readAsDataURL(file);}
function save(cv,name){var a=document.createElement('a');a.download=name;a.href=cv.toDataURL('image/png');a.click();}

[].forEach.call(document.querySelectorAll('#bcg .tabs button'),function(b){b.onclick=function(){
 [].forEach.call(document.querySelectorAll('#bcg .tabs button,#bcg .pane'),function(e){e.classList.remove('on')});
 b.classList.add('on');document.querySelector('#bcg .pane[data-p="'+b.dataset.t+'"]').classList.add('on');if(b.dataset.t==='qr')makeQR();};});
$('bcg-make').onclick=makeBar;$('bcg-shape').onchange=makeBar;$('bcg-depth').oninput=makeBar;$('bcg-fmt').onchange=makeBar;
$('bcg-img').onchange=function(){if(this.files[0])readImg(this.files[0],function(im){userShape=im;makeBar();});};
$('bcg-png').onclick=function(){save($('bcg-cv'),'barcode.png')};
$('bcg-qmake').onclick=makeQR;$('bcg-qpng').onclick=function(){save($('bcg-qcv'),'qrcode.png')};
$('bcg-logo').onchange=function(){if(this.files[0])readImg(this.files[0],function(im){userLogo=im;makeQR();});};
$('bcg-qclear').onclick=function(){userLogo=null;$('bcg-logo').value='';makeQR();};
window.bcgTest={makeBar:makeBar,makeQR:makeQR,scan:scan,setLogo:function(im){userLogo=im}};
makeBar();
})();
</script>
</div>
